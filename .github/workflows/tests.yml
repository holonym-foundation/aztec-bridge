name: Tests

on:
  pull_request:
    branches:
      - main
      - testnet
  push:
    branches:
      - main
      - testnet

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-pnpm-and-install
        with:
          working-directory: .

      - name: SDK tests
        working-directory: ./packages/sdk
        run: pnpm test

      # No DATABASE_URL: the suites mock the Prisma client, but `prisma generate`
      # (run by the frontend's postinstall) still has to have produced the client
      # the modules under test import their enums from.
      - name: Frontend tests
        working-directory: ./frontend
        run: pnpm test
