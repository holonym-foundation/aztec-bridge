# Deploy the Aztec Bridge testnet site (testnet.shield.human.tech) to its own Vercel project.
# Mirrors vercel-deploy-bridge.yml but targets the testnet branch, project, and database.
# Network selection (NEXT_PUBLIC_AZTEC_ENV=testnet, Sepolia/testnet RPC + node URLs) is
# configured in the testnet Vercel project's Production environment and pulled by `vercel build`.
name: Deploy Aztec Bridge (testnet) to Vercel
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_TESTNET_PROJECT_ID }}
  ETHEREUM_RPC_URL: ${{ secrets.TESTNET_ETHEREUM_RPC_URL }}
  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
  JWT_SECRET: ${{ secrets.TESTNET_JWT_SECRET }}
  NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
  NEXT_PUBLIC_DATADOG_APPLICATION_ID: ${{ secrets.NEXT_PUBLIC_DATADOG_APPLICATION_ID }}
  NEXT_PUBLIC_DATADOG_CLIENT_TOKEN: ${{ secrets.NEXT_PUBLIC_DATADOG_CLIENT_TOKEN }}
  NEXT_PUBLIC_DATADOG_SITE: ${{ secrets.NEXT_PUBLIC_DATADOG_SITE }}
  NEXT_PUBLIC_DATADOG_SERVICE: ${{ secrets.NEXT_PUBLIC_DATADOG_SERVICE }}
  NEXT_PUBLIC_DATADOG_ENV: testnet
  NEXT_PUBLIC_DATADOG_LOGS_CLIENT_TOKEN: ${{ secrets.NEXT_PUBLIC_DATADOG_LOGS_CLIENT_TOKEN }}
  DATABASE_URL: ${{ secrets.TESTNET_DATABASE_URL }}

on:
  push:
    branches:
      - testnet

jobs:
  Deploy-Testnet:
    permissions: write-all
    runs-on: ubuntu-latest
    if: github.ref_name == 'testnet'
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-pnpm-and-install
        with:
          working-directory: .

      - name: Build SDK
        working-directory: ./packages/sdk
        run: pnpm build

      - name: Run DB migrations
        working-directory: ./frontend
        run: pnpm exec prisma migrate deploy

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      - name: Build Next App
        working-directory: ./frontend
        run: pnpm build

      - name: Pull Production Environment From Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Testnet Production
        run: vercel deploy --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
